kind = "web"
previewPath = "/"
title = "Bro Code PW"
version = "1.0.0"
id = "artifacts/edutoppers"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20814

[services.development]
run = "pnpm --filter @workspace/edutoppers run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/edutoppers", "run", "build" ]
serve = "static"
publicDir = "artifacts/edutoppers/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20814"
BASE_PATH = "/"